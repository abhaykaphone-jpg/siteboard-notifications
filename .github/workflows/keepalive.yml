name: Keep the schedule alive
# GitHub pauses scheduled jobs in public repositories after 60 days without activity.
# This makes a tiny commit once a month so the notifications never stop.
on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > .keepalive
          git config user.name "siteboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keep schedule alive" || exit 0
          git push
